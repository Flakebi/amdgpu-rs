[package]
name = "gpu-kernel-proc-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[features]
amd = ["dep:amdgpu-device-libs-build"]

[dependencies]
amdgpu-device-libs-build = { path = "../../amdgpu-rs/amdgpu-device-libs-build", optional = true }
quote = "1"
syn = { version = "2", features = ["full"] }
toml = "1"
